<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخدمات الإلكترونية - بوابة المواطن الذكية</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app-root">


    <!-- ================= Navbar ================= -->

    <Navbar></Navbar>



    <!-- ================= Services Page ================= -->

    <main class="services-page">


        <!-- Page Header -->

        <div class="services-page-header">

            <span>
                {{ smallTitle }}
            </span>

            <h1>
                {{ pageTitle }}
            </h1>

            <p>
                {{ pageDescription }}
            </p>

        </div>



        <!-- ================= Search ================= -->

        <div class="services-search">

            <input
                type="text"
                v-model="search"
                placeholder="ابحث عن خدمة..."
            >

        </div>



        <!-- ================= Categories ================= -->

        <div class="category-buttons">

            <button
                :class="{ active: selectedCategory === 'الكل' }"
                @click="selectedCategory = 'الكل'"
            >
                الكل
            </button>


            <button
                :class="{ active: selectedCategory === 'وثائق' }"
                @click="selectedCategory = 'وثائق'"
            >
                الوثائق
            </button>


            <button
                :class="{ active: selectedCategory === 'مركبات' }"
                @click="selectedCategory = 'مركبات'"
            >
                المركبات
            </button>


            <button
                :class="{ active: selectedCategory === 'عقارات' }"
                @click="selectedCategory = 'عقارات'"
            >
                العقارات
            </button>


            <button
                :class="{ active: selectedCategory === 'تعليم' }"
                @click="selectedCategory = 'تعليم'"
            >
                التعليم
            </button>

        </div>



        <!-- ================= Services ================= -->

        <div class="service-cards">


            <div
                class="service-card"
                v-for="service in filteredServices"
                :key="service.id"
            >


                <div class="service-icon">

                    <img
                        :src="service.image"
                        :alt="service.name"
                    >

                </div>


                <h3>
                    {{ service.name }}
                </h3>


                <p>
                    {{ service.description }}
                </p>


                <span class="service-category">
                    {{ service.category }}
                </span>


                <a href="#">
                    عرض الخدمة ←
                </a>


            </div>


        </div>



        <!-- ================= No Results ================= -->
         <p
            v-if="filteredServices.length === 0"
            class="no-result"
        >
            لا توجد خدمات مطابقة للبحث
        </p>


    </main>



    <!-- ================= Footer ================= -->

    <app-footer></app-footer>


</div>



<!-- Vue -->

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<!-- Services JavaScript -->
<script  src="components/navbar.js"></script>
<script src="components/footer.js"></script>
<script src="services.js"></script>


</body>

</html>
